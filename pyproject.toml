[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bus-booking"
version = "0.1.0"
description = "In-memory backend engine for bus ticket booking"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.116",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
